<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYAPOTISM! — Catnip Mining Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Mochiy+Pop+One&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 12 L9 3 L14 9 L18 9 L23 3 L26 12 Q30 28 16 29 Q2 28 6 12Z' fill='%23ff9e7a'/%3E%3Ccircle cx='12' cy='17' r='2' fill='%232a1f33'/%3E%3Ccircle cx='20' cy='17' r='2' fill='%232a1f33'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo"><span>NYAPOTISM!</span><small>Catnip Mining Co.</small></div>
    <div class="res" id="resCatnip" data-tip="catnip"><i class="nip big"></i><b id="catnip">0</b><span>catnip</span></div>
    <div class="res milk" id="resMilk" hidden data-tip="milk"><span class="yi">🥛</span><b id="milk">0</b><span>milk</span></div>
    <div class="res yarn" id="resYarn" hidden data-tip="loom:km_catnip"><span class="yi">🧶</span><b id="yarn">0</b><span>yarn</span></div>
    <div class="ep" id="epTitle"></div>
    <div class="ctrl">
      <button id="btnPause" data-act="pause" title="Pause [Space]">⏸</button>
      <button id="btnFF" data-act="ff" data-tip="bank">⏩ <small>2×</small><span class="bk">bank <b id="bank">0:00</b></span></button>
      <span id="devSpeeds"></span>
      <button id="btnMusic" class="snd" data-act="cycle:music" data-tip="snd:music"></button>
      <button id="btnSfx" class="snd" data-act="cycle:sfx" data-tip="snd:sfx"></button>
      <button data-act="help" title="How to play">?</button>
      <button data-act="settings" title="Settings">⚙</button>
    </div>
  </header>
  <aside id="crew">
    <div class="rail-h">ON SHIFT</div>
    <div id="crewList"></div>
  </aside>
  <main id="stage">
    <div id="hud"></div>
    <div id="mineWrap">
      <canvas id="mine"></canvas>
      <div id="overlay"></div>
      <div id="banner"></div>
      <div id="traitPop"></div>
      <div id="eyePip" title="Eyecatch! (click to skip)"><canvas width="640" height="360"></canvas><div class="eye-tag">EYECATCH</div></div>
    </div>
    <div id="toolbar">
      <div id="toolBtns"></div>
      <div id="actives"></div>
    </div>
  </main>
  <section id="hq">
    <nav id="tabs"></nav>
    <div id="panel"></div>
  </section>
</div>
<div id="novel"></div>
<div id="toasts"></div>
<div id="faxTray"></div>
<div id="tip"></div>
<div id="modal" hidden></div>

<script src="js/core/util.js"></script>
<script src="js/data/tiers.js"></script>
<script src="js/data/traits.js"></script>
<script src="js/data/content.js"></script>
<script src="js/data/upgrades.js"></script>
<script src="js/data/faxes.js"></script>
<script src="js/data/loom.js"></script>
<script src="js/data/events.js"></script>
<script src="js/sim/minegen.js"></script>
<script src="js/sim/catgirl.js"></script>
<script src="js/sim/episode.js"></script>
<script src="js/sim/game.js"></script>
<script src="js/sim/bot.js"></script>
<script src="js/render/sprites.js"></script>
<script src="js/render/mineview.js"></script>
<script src="js/render/eyecatch.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui/panels.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
